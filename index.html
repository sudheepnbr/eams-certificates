<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Certificate verification</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f4f6fb; color: #0f2744; font-family: "Segoe UI", Arial, sans-serif; }
    main { width: min(520px, calc(100% - 32px)); background: #fff; border: 1px solid #dbe3ee; border-radius: 16px; padding: 28px 24px; text-align: center; }
    h1 { margin: 0 0 8px; font-size: 1.35rem; }
    p { margin: 0; line-height: 1.5; }
    .id { margin-top: 14px; color: #64748b; font-weight: 700; }
    a { color: #0f2744; font-weight: 800; }
    .miss { color: #b91c1c; }
  </style>
</head>
<body>
  <main>
    <h1>Oman International Hospital</h1>
    <p id="result">Checking this certificate…</p>
    <p class="id" id="code"></p>
  </main>
  <script>
    var params = new URLSearchParams(location.search);
    var id = (params.get("id") || "").trim();
    var result = document.getElementById("result");
    var code = document.getElementById("code");
    var phone = "24903500";
    function contact() {
      return ' For more information please contact <a href="tel:+96824903500">' + phone + "</a>.";
    }
    if (!id) {
      result.className = "miss";
      result.innerHTML = "This certificate number was not found." + contact();
    } else {
      code.textContent = id;
      fetch("certificates.json?t=" + Date.now(), { cache: "no-store" })
        .then(function (response) { return response.json(); })
        .then(function (log) {
          if (log && log[id]) {
            result.innerHTML = "Verification successfully completed from Oman International Hospital Muscat." + contact();
          } else {
            result.className = "miss";
            result.innerHTML = "This certificate number was not found." + contact();
          }
        })
        .catch(function () {
          result.className = "miss";
          result.innerHTML = "This certificate number was not found." + contact();
        });
    }
  </script>
</body>
</html>
